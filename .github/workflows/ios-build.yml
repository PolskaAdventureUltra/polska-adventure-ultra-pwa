# Budowanie apki na iPhone'a na maszynie macOS GitHuba (bez Maca w domu).
# Na razie BEZ podpisu: build na symulator - sprawdza, czy projekt iOS się kompiluje.
# Podpis + wysyłka do TestFlight dojdą, gdy będzie konto Apple Developer.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/ios*"]
    paths: ["native/**", "app.js", "index.html", "style.css", "service-worker.js", ".github/workflows/ios-build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel  # arm64 (macos-15) bywa bez wolnych maszyn
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Instalacja zależności
        working-directory: native
        run: npm ci
      - name: Kopiowanie strony do projektu iOS
        working-directory: native
        run: npm run sync:ios
      - name: Build na symulator (bez podpisu)
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -50
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      # Plik .ipa na prawdziwego iPhone'a, BEZ podpisu - podpisuje go Sideloadly (darmowe Apple ID,
      # apka działa 7 dni) albo Xcode. Do pobrania w Actions → ten przebieg → Artifacts → PAU-iphone-ipa.
      - name: Build na iPhone'a (bez podpisu) + .ipa
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          APP=build-device/Build/Products/Release-iphoneos/App.app
          test -d "$APP"
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          (cd ipa && zip -qry "../PAU-${VER}-iphone-niepodpisana.ipa" Payload)
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PAU-iphone-ipa
          path: native/ios/App/*.ipa
          retention-days: 30
